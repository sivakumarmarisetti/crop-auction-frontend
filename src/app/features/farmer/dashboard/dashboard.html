<app-page-header
    title="Good Morning 👋"
    subtitle="Here's what's happening on your farm today.">
</app-page-header>

@if (dashboard) {

<div class="stats-grid">

    <app-stat-card
        title="Total Crops"
        [value]="dashboard.totalCrops"
        icon="grass"
        iconBackground="#DCFCE7"
        iconColor="#16A34A">
    </app-stat-card>

    <app-stat-card
        title="Available"
        [value]="dashboard.availableCrops"
        icon="inventory_2"
        iconBackground="#DBEAFE"
        iconColor="#2563EB">
    </app-stat-card>

    <app-stat-card
        title="Requested"
        [value]="dashboard.requestedCrops"
        icon="pending_actions"
        iconBackground="#FEF3C7"
        iconColor="#D97706">
    </app-stat-card>

    <app-stat-card
        title="Sold"
        [value]="dashboard.soldCrops"
        icon="payments"
        iconBackground="#FEE2E2"
        iconColor="#DC2626">
    </app-stat-card>

</div>

<div class="dashboard-content">

    <div class="left-panel">

        <app-table-card
            title="Recent Crops"
            subtitle="Your recently added crops">

            <table
                mat-table
                [dataSource]="dashboard.recentCrops">

                <ng-container matColumnDef="cropName">
                    <th mat-header-cell *matHeaderCellDef>Crop</th>
                    <td mat-cell *matCellDef="let crop">
                        {{ crop.cropName }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="category">
                    <th mat-header-cell *matHeaderCellDef>Category</th>
                    <td mat-cell *matCellDef="let crop">
                        {{ crop.category }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="quantity">
                    <th mat-header-cell *matHeaderCellDef>Quantity</th>
                    <td mat-cell *matCellDef="let crop">
                        {{ crop.quantity }} Kg
                    </td>
                </ng-container>

                <ng-container matColumnDef="expectedPrice">
                    <th mat-header-cell *matHeaderCellDef>Price</th>
                    <td mat-cell *matCellDef="let crop">
                        ₹ {{ crop.expectedPrice }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let crop">
                        {{ crop.status }}
                    </td>
                </ng-container>

                <tr
                    mat-header-row
                    *matHeaderRowDef="displayedColumns">
                </tr>

                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns">
                </tr>

            </table>

        </app-table-card>

    </div>

    <div class="right-panel">

        <div class="quick-actions">

            <h3>Quick Actions</h3>

            <button routerLink="/farmer/add-crop">
                🌾 Add Crop
            </button>

            <button routerLink="/farmer/my-crops">
                📦 My Crops
            </button>

            <button routerLink="/farmer/my-auction-requests">
                📋 Auction Requests
            </button>

        </div>

    </div>

</div>

}
