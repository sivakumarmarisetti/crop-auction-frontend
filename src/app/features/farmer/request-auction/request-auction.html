<div class="page-container">

  <h2>Request Auction</h2>

  <mat-form-field appearance="outline" class="full-width">

    <mat-label>Remarks</mat-label>

    <input
      matInput
      [formControl]="remarks"
      placeholder="Optional remarks for admin">

  </mat-form-field>

  <table
    mat-table
    [dataSource]="dataSource"
    matSort>

    <ng-container matColumnDef="cropName">

      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Crop
      </th>

      <td mat-cell *matCellDef="let crop">
        {{ crop.cropName }}
      </td>

    </ng-container>

    <ng-container matColumnDef="category">

      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Category
      </th>

      <td mat-cell *matCellDef="let crop">
        {{ crop.category }}
      </td>

    </ng-container>

    <ng-container matColumnDef="quantity">

      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Quantity
      </th>

      <td mat-cell *matCellDef="let crop">
        {{ crop.quantity }}
      </td>

    </ng-container>

    <ng-container matColumnDef="expectedPrice">

      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Expected Price
      </th>

      <td mat-cell *matCellDef="let crop">
        ₹ {{ crop.expectedPrice }}
      </td>

    </ng-container>

    <ng-container matColumnDef="status">

      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let crop">
        {{ crop.status }}
      </td>

    </ng-container>

    <ng-container matColumnDef="action">

      <th mat-header-cell *matHeaderCellDef>
        Action
      </th>

      <td mat-cell *matCellDef="let crop">

        <button
          mat-raised-button
          color="primary"
          (click)="requestAuction(crop)">

          Request Auction

        </button>

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

  <mat-paginator
    [pageSize]="5">
  </mat-paginator>

</div>
