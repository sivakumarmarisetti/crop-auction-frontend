<mat-form-field appearance="outline">

  <mat-label>Search Auction</mat-label>

  <input
    matInput
    (keyup)="applyFilter($event)"
    placeholder="Search...">

</mat-form-field>

<table
  mat-table
  [dataSource]="dataSource"
  matSort>

  <ng-container matColumnDef="auctionCode">

    <th
      mat-header-cell
      *matHeaderCellDef>

      Auction Code

    </th>

    <td
      mat-cell
      *matCellDef="let row">

      {{ row.auctionCode }}

    </td>

  </ng-container>

  <ng-container matColumnDef="cropName">

    <th mat-header-cell *matHeaderCellDef>

      Crop

    </th>

    <td mat-cell *matCellDef="let row">

      {{ row.cropName }}

    </td>

  </ng-container>

  <ng-container matColumnDef="category">

    <th mat-header-cell *matHeaderCellDef>

      Category

    </th>

    <td mat-cell *matCellDef="let row">

      {{ row.category }}

    </td>

  </ng-container>

  <ng-container matColumnDef="farmerName">

    <th mat-header-cell *matHeaderCellDef>

      Farmer

    </th>

    <td mat-cell *matCellDef="let row">

      {{ row.farmerName }}

    </td>

  </ng-container>

  <ng-container matColumnDef="startingPrice">

    <th mat-header-cell *matHeaderCellDef>

      Starting Price

    </th>

    <td mat-cell *matCellDef="let row">

      ₹{{ row.startingPrice }}

    </td>

  </ng-container>

  <ng-container matColumnDef="currentHighestBid">

    <th mat-header-cell *matHeaderCellDef>

      Highest Bid

    </th>

    <td mat-cell *matCellDef="let row">

      ₹{{ row.currentHighestBid }}

    </td>

  </ng-container>

  <ng-container matColumnDef="status">

    <th mat-header-cell *matHeaderCellDef>

      Status

    </th>

    <td mat-cell *matCellDef="let row">

      {{ row.status }}

    </td>

  </ng-container>

  <ng-container matColumnDef="endTime">

    <th mat-header-cell *matHeaderCellDef>

      Ends

    </th>

    <td mat-cell *matCellDef="let row">

      {{ row.endTime | date:'medium' }}

    </td>

  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns">
  </tr>

  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;">
  </tr>

</table>

<mat-paginator
  [pageSize]="10">
</mat-paginator>
