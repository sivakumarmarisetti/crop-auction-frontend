<app-auth-layout>

    <app-auth-card>

        <app-auth-header
            title="Create Farmer Account"
            subtitle="Register to start selling your crops">
        </app-auth-header>

        <form
    [formGroup]="registerForm"
    (ngSubmit)="register()">

            <mat-form-field
                appearance="outline"
                class="full-width">

                <mat-label>Full Name</mat-label>

                <input
                    matInput
                    formControlName="name">

            </mat-form-field>

            <mat-form-field
                appearance="outline"
                class="full-width">

                <mat-label>Email</mat-label>

                <input
                    matInput
                    type="email"
                    formControlName="email">

            </mat-form-field>

            <mat-form-field
                appearance="outline"
                class="full-width">

                <mat-label>Mobile Number</mat-label>

                <input
                    matInput
                    formControlName="mobile">

            </mat-form-field>

            <mat-form-field
                appearance="outline"
                class="full-width">

                <mat-label>Aadhaar Number</mat-label>

                <input
                    matInput
                    formControlName="aadhaarNumber">

            </mat-form-field>

            <mat-form-field
                appearance="outline"
                class="full-width">

                <mat-label>Password</mat-label>

                <input
                    matInput
                    type="password"
                    formControlName="password">

            </mat-form-field>
            <mat-form-field
    appearance="outline"
    class="full-width">

    <mat-label>Confirm Password</mat-label>

    <input
        matInput
        type="password"
        formControlName="confirmPassword">

</mat-form-field>

            <button
                mat-flat-button
                color="primary"
                class="auth-submit-button"
                type="submit">

                Register as Farmer

            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a routerLink="/login">

                Login

            </a>

        </div>

    </app-auth-card>

</app-auth-layout>
