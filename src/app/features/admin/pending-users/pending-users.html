<app-page-header
    title="Pending Users"
    subtitle="Approve or reject newly registered users">
</app-page-header>

<app-page-toolbar>

    <app-search-bar
        placeholder="Search users..."
        (search)="applyFilter($event)">
    </app-search-bar>

</app-page-toolbar>

<app-table-card
    title="Pending User List"
    subtitle="Users waiting for administrator approval">

    @if (hasUsers) {

        <table
            mat-table
            [dataSource]="dataSource"
            matSort>

            <!-- Name -->

            <ng-container matColumnDef="name">

                <th
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header>

                    Name

                </th>

                <td
                    mat-cell
                    *matCellDef="let user">

                    {{ user.name }}

                </td>

            </ng-container>

            <!-- Email -->

            <ng-container matColumnDef="email">

                <th
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header>

                    Email

                </th>

                <td
                    mat-cell
                    *matCellDef="let user">

                    {{ user.email }}

                </td>

            </ng-container>

            <!-- Mobile -->

            <ng-container matColumnDef="mobile">

                <th
                    mat-header-cell
                    *matHeaderCellDef
                    mat-sort-header>

                    Mobile

                </th>

                <td
                    mat-cell
                    *matCellDef="let user">

                    {{ user.mobile }}

                </td>

            </ng-container>

            <!-- Role -->

            <ng-container matColumnDef="role">

                <th
                    mat-header-cell
                    *matHeaderCellDef>

                    Role

                </th>

                <td
                    mat-cell
                    *matCellDef="let user">

                    <app-status-chip
                        [text]="
                            user.role === 'FARMER'
                                ? 'Farmer'
                                : user.role === 'BUYER'
                                    ? 'Buyer'
                                    : 'Administrator'
                        "
                        [color]="
                            user.role === 'FARMER'
                                ? 'green'
                                : user.role === 'BUYER'
                                    ? 'blue'
                                    : 'purple'
                        ">
                    </app-status-chip>

                </td>

            </ng-container>

            <!-- Actions -->

            <ng-container matColumnDef="actions">

                <th
                    mat-header-cell
                    *matHeaderCellDef>

                    Actions

                </th>

                <td
                    mat-cell
                    *matCellDef="let user">

                    <div class="action-buttons">

                        <button
                            mat-stroked-button
                            color="primary"
                            (click)="approveUser(user.id)">

                            ✓ Approve

                        </button>

                        <button
                            mat-stroked-button
                            color="warn"
                            (click)="rejectUser(user.id)">

                            ✕ Reject

                        </button>

                    </div>

                </td>

            </ng-container>

            <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns">
            </tr>

            <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns">
            </tr>

        </table>

        <mat-paginator
            [pageSize]="10">
        </mat-paginator>

    } @else {

        <app-empty-state
            icon="👤"
            title="No Pending Users"
            subtitle="All user registrations have already been reviewed.">
        </app-empty-state>

    }

</app-table-card>
